name: Repository sanity

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-ci.txt
      # A árvore inteira, não uma lista de arquivos escolhidos a dedo. As
      # exceções vivem em `[tool.ruff.lint.per-file-ignores]` do pyproject,
      # nomeadas e justificadas.
      - name: Ruff
        run: ruff check .
      - name: Nested-Git and path discipline
        run: |
          python scripts/repo_paths.py
          python scripts/check_git_isolation.py
          python scripts/check_path_discipline.py
      # Os espelhos .claude/ são derivados e gitignorados, então um clone novo
      # não os tem. Gerá-los aqui é o mesmo bootstrap que o hook SessionStart
      # faz na máquina do autor. Os adapters .codex/, ao contrário, são
      # versionados: se o sync precisar alterá-los, `git diff` reprova o job e
      # impede que uma cópia stale seja mascarada pelo próprio bootstrap.
      - name: Generate agent mirrors (.agents -> harness adapters)
        run: |
          python scripts/sync_skills.py --quiet
          git diff --exit-code -- .codex/agents
      - run: python scripts/check_repo.py --quick
      # `browser` também fica de fora: o job não instala Chromium nem Pandoc, e
      # a auditoria visual tem job próprio (`site-browser`). Sem esta exclusão
      # os testes de browser rodavam aqui e falhavam por falta de Pandoc.
      - run: python -m pytest -q -m "not html and not pdf and not slow and not browser"

  corpus-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q tests/test_wiki_checks.py

          retention-days: 14
