name: PDF export

on:
  push:
    paths:
      - 'scripts/export_essay_pdf.py'
      - 'scripts/html_preprocess.py'
      - 'scripts/pdf_boxes.lua'
      - 'tests/test_pdf_*.py'
      - 'tests/test_export_parity.py'
      - 'requirements-ci.txt'
      - '.github/workflows/pdf-export.yml'
  pull_request:
    paths:
      - 'scripts/export_essay_pdf.py'
      - 'scripts/html_preprocess.py'
      - 'scripts/pdf_boxes.lua'
      - 'tests/test_pdf_*.py'
      - 'tests/test_export_parity.py'
      - 'requirements-ci.txt'
      - '.github/workflows/pdf-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-luatex texlive-latex-extra texlive-fonts-recommended lmodern
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q -m pdf
