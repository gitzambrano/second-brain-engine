name: Temporary finalize native Obsidian callouts

on:
  push:
    branches: [feature/explicit-callouts]
    paths:
      - '.github/workflows/native-callouts-finalize-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/explicit-callouts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize native callout rendering
        run: python .github/scripts/native_callouts_finalize_temp.py
      - name: Test native callout contract
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_html_preprocess_callouts.py
          python - <<'PY'
          from scripts.lib.html_preprocess import NATIVE_TYPES
          assert NATIVE_TYPES == {'note','abstract','info','todo','tip','success','question','warning','failure','danger','bug','example','quote'}
          PY
      - name: Commit final native callout integration
        run: |
          git config user.name 'Second Brain Callout Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add .agents/skills/conventions/SKILL.md scripts/essay_template.html scripts/pdf_boxes.lua
          if ! git diff --cached --quiet; then
            git commit -m 'feat: render native Obsidian callout types'
            git push origin HEAD:feature/explicit-callouts
          fi
