name: Fix graph mobile controls and exports once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/graph-mobile-exports-fix-once.yml

permissions:
  contents: write

# One-shot repair, revision 8: normalize stale helper tokens, patch graph/chrome,
# run focused + observable browser + repository gates, commit validated source, self-clean.
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize obsolete export note and helper token
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          graph = Path('scripts/build_graph.py')
          text = graph.read_text(encoding='utf-8')
          text, n = re.subn(r'\n<!-- canvas2svg .*?-->\n', '\n', text, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one obsolete canvas2svg head comment, got {n}')
          graph.write_text(text, encoding='utf-8')

          helper = Path('.github/scripts/fix_graph_mobile_exports_once.py')
          text = helper.read_text(encoding='utf-8')
          old = 'background:color-mix(in srgb,var(--sb-primary) 13%,var(--sb-panel));'
          new = 'background:color-mix(in srgb,var(--sb-primary) 13%,var(--sb-surface));'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale essay helper token, got {text.count(old)}')
          helper.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply source fixes
        run: python .github/scripts/fix_graph_mobile_exports_once.py
      - name: Install test dependencies
        run: |
          python -m pip install -q pytest pyyaml playwright
          python -m playwright install --with-deps chromium
      - name: Run focused regressions
        run: |
          python -m py_compile scripts/build_graph.py scripts/lib/build_public_map.py scripts/lib/render_public_essay.py
          pytest -q tests/test_graph_mobile_exports_regressions.py tests/test_public_reader_polish_contract.py tests/test_site_theme_contract.py
      - name: Browser audit exports and mobile controls
        run: python .github/scripts/audit_graph_mobile_exports_once.py
      - name: Repository quick gate
        run: python scripts/check_repo.py --quick
      - name: Upload browser audit
        uses: actions/upload-artifact@v4
        with:
          name: graph-mobile-export-audit
          path: visual-audit/
          retention-days: 3
      - name: Commit source fixes
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/graph-mobile-exports-fix-once.yml .github/scripts/fix_graph_mobile_exports_once.py .github/scripts/audit_graph_mobile_exports_once.py
          git rm -f .github/workflows/ui-polish-once.yml .github/scripts/apply_ui_polish_once.py .github/scripts/finalize_graph_edge_defaults.py || true
          git add scripts/build_graph.py scripts/lib/build_public_map.py scripts/site_src/index.html scripts/site_src/essay-theme.css tests/test_graph_mobile_exports_regressions.py
          git diff --cached --check
          git commit -m "Fix graph mobile controls and exports"
          git push origin HEAD:main
