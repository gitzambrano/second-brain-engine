name: HTML export

on:
  push:
    paths:
      - 'scripts/export_essay_html.py'
      - 'scripts/html_preprocess.py'
      - 'scripts/essay_template.html'
      - 'tests/test_html_*.py'
      - 'tests/test_checker_selftests.py'
      - 'requirements-ci.txt'
      - '.github/workflows/html-export.yml'
  pull_request:
    paths:
      - 'scripts/export_essay_html.py'
      - 'scripts/html_preprocess.py'
      - 'scripts/essay_template.html'
      - 'tests/test_html_*.py'
      - 'tests/test_checker_selftests.py'
      - 'requirements-ci.txt'
      - '.github/workflows/html-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m html
