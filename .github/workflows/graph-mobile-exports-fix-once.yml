name: Fix graph mobile controls and exports once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/graph-mobile-exports-fix-once.yml

permissions:
  contents: write

# One-shot repair, revision 11: normalize stale helper tokens, patch graph/chrome,
# syntax-check generated JavaScript, run focused + browser + repository gates,
# commit validated source, then self-clean. Browser export audit opens the mobile
# panel through the real toggle before exercising PNG and SVG downloads.
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize obsolete export note and helper tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          graph = Path('scripts/build_graph.py')
          text = graph.read_text(encoding='utf-8')
          text, n = re.subn(r'\n<!-- canvas2svg .*?-->\n', '\n', text, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one obsolete canvas2svg head comment, got {n}')
          graph.write_text(text, encoding='utf-8')

          helper = Path('.github/scripts/fix_graph_mobile_exports_once.py')
          text = helper.read_text(encoding='utf-8')

          old = 'background:color-mix(in srgb,var(--sb-primary) 13%,var(--sb-panel));'
          new = 'background:color-mix(in srgb,var(--sb-primary) 13%,var(--sb-surface));'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale essay helper token, got {text.count(old)}')
          text = text.replace(old, new)

          # Replace the SVG join structurally so nested source-code escaping cannot
          # turn a JavaScript escape into a physical newline in the generated page.
          start = text.find('return parts.join("')
          if start < 0:
              raise SystemExit('SVG join start not found')
          end = text.find('");', start)
          if end < 0:
              raise SystemExit('SVG join end not found')
          end += len('");')
          if text.find('return parts.join("', start + 1) >= 0:
              raise SystemExit('expected exactly one SVG join')
          text = text[:start] + 'return parts.join(String.fromCharCode(10));' + text[end:]
          helper.write_text(text, encoding='utf-8')

          audit = Path('.github/scripts/audit_graph_mobile_exports_once.py')
          audit_text = audit.read_text(encoding='utf-8')
          old_error = 'page.on("pageerror", lambda exc: page_errors.append(str(exc)))'
          new_error = 'page.on("pageerror", lambda exc: page_errors.append({"message": str(exc), "stack": getattr(exc, "stack", "")}))'
          if audit_text.count(old_error) != 1:
              raise SystemExit('pageerror diagnostic hook not found exactly once')
          audit.write_text(audit_text.replace(old_error, new_error), encoding='utf-8')
          PY
      - name: Apply source fixes
        run: python .github/scripts/fix_graph_mobile_exports_once.py
      - name: Install test dependencies
        run: |
          python -m pip install -q pytest pyyaml playwright
          python -m playwright install --with-deps chromium
      - name: Run focused regressions
        run: |
          python -m py_compile scripts/build_graph.py scripts/lib/build_public_map.py scripts/lib/render_public_essay.py
          pytest -q tests/test_graph_mobile_exports_regressions.py tests/test_public_reader_polish_contract.py tests/test_site_theme_contract.py
      - name: Syntax-check generated graph JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          import build_graph

          nodes = [
              {"id":"essay:a","title":"Alpha","type":"essay","tags":[],"degree":1,"sizeBytes":100,"sizeLines":10,"x0":-50,"y0":0,"x":-50,"y":0,"htmlFile":None,"url":None,"public":False},
              {"id":"concept:b","title":"Beta","type":"concept","tags":[],"degree":2,"sizeBytes":80,"sizeLines":8,"x0":0,"y0":25,"x":0,"y":25,"htmlFile":None,"url":None,"public":False},
              {"id":"entity:c","title":"Gamma","type":"entity","tags":[],"degree":1,"sizeBytes":60,"sizeLines":6,"x0":50,"y0":0,"x":50,"y":0,"htmlFile":None,"url":None,"public":False},
          ]
          edges = [
              {"source":"essay:a","target":"concept:b","kind":"wikilink"},
              {"source":"concept:b","target":"entity:c","kind":"wikilink"},
          ]
          html = build_graph.render_html(nodes, edges, [], {"essays":{}, "mathjax":"", "css":""})
          out = Path('visual-audit/js-check')
          out.mkdir(parents=True, exist_ok=True)
          scripts = []
          for idx, match in enumerate(re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>', html, re.S | re.I)):
              attrs = match.group('attrs')
              if re.search(r'type=["\']application/(?:json|ld\+json)["\']', attrs, re.I):
                  continue
              body = match.group('body')
              if not body.strip():
                  continue
              path = out / f'inline-{idx}.js'
              path.write_text(body, encoding='utf-8')
              scripts.append(path)
          if not scripts:
              raise SystemExit('no JavaScript blocks extracted')
          for path in scripts:
              subprocess.run(['node', '--check', str(path)], check=True)
          print(f'node --check PASS: {len(scripts)} inline script(s)')
          PY
      - name: Browser audit exports and mobile controls
        run: python .github/scripts/audit_graph_mobile_exports_once.py
      - name: Repository quick gate
        run: python scripts/check_repo.py --quick
      - name: Upload browser audit
        uses: actions/upload-artifact@v4
        with:
          name: graph-mobile-export-audit
          path: visual-audit/
          retention-days: 3
      - name: Commit source fixes
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/graph-mobile-exports-fix-once.yml .github/scripts/fix_graph_mobile_exports_once.py .github/scripts/audit_graph_mobile_exports_once.py
          git rm -f .github/workflows/ui-polish-once.yml .github/scripts/apply_ui_polish_once.py .github/scripts/finalize_graph_edge_defaults.py || true
          git add scripts/build_graph.py scripts/lib/build_public_map.py scripts/site_src/index.html scripts/site_src/essay-theme.css tests/test_graph_mobile_exports_regressions.py
          git diff --cached --check
          git commit -m "Fix graph mobile controls and exports"
          git push origin HEAD:main
