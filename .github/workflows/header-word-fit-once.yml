name: Apply measured header-word fit once

on:
  push:
    branches:
      - fix/pdf-reference-table-clipping-2026-09-10

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-reference-table-clipping-2026-09-10
          fetch-depth: 0
      - name: Apply measured fit
        run: python .github/scripts/apply_header_word_fit.py
      - name: Test
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pytest -q tests/test_visual_export_regressions.py
      - name: Commit refinement
        run: |
          git config user.name second-brain-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/header-word-fit-once.yml .github/scripts/apply_header_word_fit.py
          git add scripts/export_essay_pdf.py scripts/pdf_boxes.lua tests/test_visual_export_regressions.py
          git commit -m "fix: fit wide PDF table header words to cells"
          git push origin HEAD:fix/pdf-reference-table-clipping-2026-09-10
