name: Apply UI polish once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-polish-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore: apply UI polish runner v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-of-truth UI changes
        run: python .github/scripts/apply_ui_polish_once.py
      - name: Validate edited sources
        run: |
          python -m pip install -q pytest pyyaml
          python -m py_compile scripts/build_graph.py scripts/lib/build_public_map.py scripts/lib/render_public_essay.py scripts/build_site.py
          python -m pytest -q tests/test_public_reader_polish_contract.py tests/test_site_theme_contract.py
      - name: Commit validated source changes
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/site_src/site.css scripts/site_src/index.html scripts/site_src/essay-theme.css scripts/lib/render_public_essay.py scripts/essay_template.html scripts/build_graph.py scripts/lib/build_public_map.py tests/test_public_reader_polish_contract.py
          git diff --cached --check
          git commit -m "Polish public chrome and graph readability"
          git push origin HEAD:main
