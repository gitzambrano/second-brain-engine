name: Apply PDF fixes once

on:
  push:
    branches:
      - fix/pdf-reference-table-clipping-2026-09-10

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-reference-table-clipping-2026-09-10
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_pdf_fixes.py
      - name: Test
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pytest -q tests/test_visual_export_regressions.py
      - name: Commit renderer changes
        run: |
          git config user.name second-brain-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/apply-pdf-fixes-once.yml .github/scripts/apply_pdf_fixes.py
          git add scripts/pdf_boxes.lua tests/test_visual_export_regressions.py
          git commit -m "fix: prevent PDF reference and table clipping"
          git push origin HEAD:fix/pdf-reference-table-clipping-2026-09-10
