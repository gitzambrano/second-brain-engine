name: Fix Kit form once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-kit-form-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch subscribe form runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('scripts/site_src/index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace(
              '.subscribe-embed .formkit-fields{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;margin:0!important;width:100%!important}',
              '.subscribe-embed .formkit-fields{display:grid!important;grid-template-columns:minmax(0,1fr)!important;align-items:stretch!important;gap:8px!important;margin:0!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important}'
          )
          s = re.sub(
              r'\.subscribe-embed \.formkit-guarantee\{[^}]*\}',
              '.subscribe-embed .formkit-guarantee,.subscribe-embed [data-element="guarantee"]{display:none!important}',
              s,
              count=1,
          )
          old = '<script>(function(){var dialog=document.getElementById("subscribeDialog");var open=document.getElementById("subscribeOpen");var mount=document.getElementById("kitEmbedMount");if(!dialog||!open||!mount||typeof dialog.showModal!=="function")return;function loadKit(){if(mount.dataset.loaded)return;var script=document.createElement("script");script.async=true;script.dataset.uid=mount.dataset.uid;script.src=mount.dataset.src;mount.dataset.loaded="1";mount.appendChild(script)}open.addEventListener("click",function(){loadKit();dialog.showModal()});dialog.addEventListener("click",function(event){if(event.target===dialog)dialog.close()})})();</script>'
          new = '''<script>(function(){var dialog=document.getElementById("subscribeDialog");var open=document.getElementById("subscribeOpen");var mount=document.getElementById("kitEmbedMount");if(!dialog||!open||!mount||typeof dialog.showModal!=="function")return;function setImportant(el,name,value){if(el)el.style.setProperty(name,value,"important")}function normalizeKit(){mount.querySelectorAll('.formkit-guarantee,[data-element="guarantee"]').forEach(function(el){el.remove()});mount.querySelectorAll('.formkit-fields').forEach(function(el){setImportant(el,"display","grid");setImportant(el,"grid-template-columns","minmax(0,1fr)");setImportant(el,"width","100%");setImportant(el,"max-width","100%");setImportant(el,"box-sizing","border-box")});mount.querySelectorAll('.formkit-fields > *,.formkit-field,.formkit-input,[data-element="submit"],.formkit-submit').forEach(function(el){setImportant(el,"box-sizing","border-box");setImportant(el,"width","100%");setImportant(el,"max-width","100%");setImportant(el,"min-width","0");setImportant(el,"margin-left","0");setImportant(el,"margin-right","0");setImportant(el,"align-self","stretch");setImportant(el,"justify-self","stretch")})}var observer=new MutationObserver(function(){requestAnimationFrame(normalizeKit)});observer.observe(mount,{childList:true,subtree:true});function loadKit(){if(mount.dataset.loaded){normalizeKit();return}var script=document.createElement("script");script.async=true;script.dataset.uid=mount.dataset.uid;script.src=mount.dataset.src;mount.dataset.loaded="1";mount.appendChild(script)}open.addEventListener("click",function(){loadKit();dialog.showModal();requestAnimationFrame(normalizeKit)});dialog.addEventListener("click",function(event){if(event.target===dialog)dialog.close()})})();</script>'''
          if old not in s:
              raise SystemExit('home subscribe script signature not found')
          s = s.replace(old, new, 1)
          if '<u>confiável</u>' not in s:
              raise SystemExit('trusted underline missing')
          index.write_text(s, encoding='utf-8')

          css = Path('scripts/site_src/essay-theme.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace(
              '.sb-subscribe-embed .formkit-fields{display:flex!important;flex-direction:column!important;gap:8px!important;margin:0!important;width:100%!important;}',
              '.sb-subscribe-embed .formkit-fields{display:grid!important;grid-template-columns:minmax(0,1fr)!important;align-items:stretch!important;gap:8px!important;margin:0!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;}'
          )
          if '.sb-subscribe-embed .formkit-guarantee' not in c:
              c += '\n.sb-subscribe-embed .formkit-guarantee,.sb-subscribe-embed [data-element="guarantee"]{display:none!important;}\n'
          else:
              c = re.sub(r'\.sb-subscribe-embed \.formkit-guarantee\{[^}]*\}', '.sb-subscribe-embed .formkit-guarantee,.sb-subscribe-embed [data-element="guarantee"]{display:none!important;}', c, count=1)
          css.write_text(c, encoding='utf-8')

          js = Path('scripts/site_src/essay.js')
          j = js.read_text(encoding='utf-8')
          needle = "  var kitMount = document.getElementById('sbKitEmbedMount');\n  function loadKit() {"
          insert = """  var kitMount = document.getElementById('sbKitEmbedMount');
  function setKitImportant(el, name, value) {
    if (el) el.style.setProperty(name, value, 'important');
  }
  function normalizeKit() {
    if (!kitMount) return;
    [].slice.call(kitMount.querySelectorAll('.formkit-guarantee,[data-element=\"guarantee\"]')).forEach(function (el) { el.remove(); });
    [].slice.call(kitMount.querySelectorAll('.formkit-fields')).forEach(function (el) {
      setKitImportant(el, 'display', 'grid');
      setKitImportant(el, 'grid-template-columns', 'minmax(0,1fr)');
      setKitImportant(el, 'width', '100%');
      setKitImportant(el, 'max-width', '100%');
      setKitImportant(el, 'box-sizing', 'border-box');
    });
    [].slice.call(kitMount.querySelectorAll('.formkit-fields > *,.formkit-field,.formkit-input,[data-element=\"submit\"],.formkit-submit')).forEach(function (el) {
      setKitImportant(el, 'box-sizing', 'border-box');
      setKitImportant(el, 'width', '100%');
      setKitImportant(el, 'max-width', '100%');
      setKitImportant(el, 'min-width', '0');
      setKitImportant(el, 'margin-left', '0');
      setKitImportant(el, 'margin-right', '0');
      setKitImportant(el, 'align-self', 'stretch');
      setKitImportant(el, 'justify-self', 'stretch');
    });
  }
  if (kitMount && 'MutationObserver' in window) {
    new MutationObserver(function () { requestAnimationFrame(normalizeKit); })
      .observe(kitMount, { childList: true, subtree: true });
  }
  function loadKit() {"""
          if needle not in j:
              raise SystemExit('essay newsletter signature not found')
          j = j.replace(needle, insert, 1)
          j = j.replace("    if (!kitMount || kitMount.dataset.loaded) return;", "    if (!kitMount) return;\n    if (kitMount.dataset.loaded) { normalizeKit(); return; }")
          j = j.replace("    subscribe.addEventListener('click', function () { loadKit(); subscribeDialog.showModal(); });", "    subscribe.addEventListener('click', function () { loadKit(); subscribeDialog.showModal(); requestAnimationFrame(normalizeKit); });")
          js.write_text(j, encoding='utf-8')
          PY
      - name: Minimal checks
        run: |
          node --check scripts/site_src/essay.js
          grep -q '<u>confiável</u>' scripts/site_src/index.html
          grep -q 'formkit-guarantee.*display:none' scripts/site_src/index.html
          grep -q 'MutationObserver' scripts/site_src/index.html
          grep -q 'MutationObserver' scripts/site_src/essay.js
      - name: Commit and self-clean
        run: |
          rm .github/workflows/fix-kit-form-once.yml
          git config user.name second-brain-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/site_src/index.html scripts/site_src/essay-theme.css scripts/site_src/essay.js .github/workflows/fix-kit-form-once.yml
          git commit -m 'Fix Kit subscribe alignment at runtime'
          git push origin HEAD:main
