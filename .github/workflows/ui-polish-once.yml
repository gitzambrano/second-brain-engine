name: Finalize graph UI polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-polish-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize graph defaults
        run: python .github/scripts/finalize_graph_edge_defaults.py
      - name: Validate
        run: |
          python -m py_compile scripts/build_graph.py
          python - <<'PY'
          from pathlib import Path
          s = Path('scripts/build_graph.py').read_text(encoding='utf-8')
          assert '    --edge: #858b93;' in s
          assert '    --edge-opacity: 0.28;' in s
          assert 'const LABEL_SHOW_AT = 1.40;' in s
          assert 'const LABEL_HIDE_AT = 1.32;' in s
          assert '"edgeOpacity": 0.28' in s
          PY
      - name: Commit
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build_graph.py
          git diff --cached --check
          git commit -m "Align graph initial edge defaults"
          git push origin HEAD:main
