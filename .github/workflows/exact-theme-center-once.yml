name: Apply exact theme glyph centering once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/exact-theme-center-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove half-pixel glyph offset
        run: python .github/scripts/remove_theme_halfpixel_once.py
      - name: Check focused contract
        run: python -m pip install -q pytest pyyaml && python -m pytest -q tests/test_public_reader_polish_contract.py
      - name: Commit and clean helper
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/exact-theme-center-once.yml .github/scripts/remove_theme_halfpixel_once.py
          git add scripts/site_src/index.html scripts/site_src/essay-theme.css tests/test_public_reader_polish_contract.py
          git diff --cached --check
          git commit -m "Center mobile theme glyph exactly"
          git push origin HEAD:main
