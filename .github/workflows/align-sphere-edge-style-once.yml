name: Align sphere edge style once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-sphere-edge-style-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align sphere visual defaults with plane graph
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_sphere.py')
          text = p.read_text(encoding='utf-8')
          if text.count('#9aa0a8') != 5:
              raise SystemExit(f'expected 5 stale sphere edge colors, got {text.count("#9aa0a8")}')
          text = text.replace('#9aa0a8', '#858b93')
          if text.count('"edgeOpacity": 0.35') != 1:
              raise SystemExit('python sphere edgeOpacity default not found exactly once')
          text = text.replace('"edgeOpacity": 0.35', '"edgeOpacity": 0.28')
          if text.count('edgeOpacity: 0.35') != 1:
              raise SystemExit('JS sphere factory edgeOpacity default not found exactly once')
          text = text.replace('edgeOpacity: 0.35', 'edgeOpacity: 0.28')
          if text.count('--edge-opacity: 0.55;') != 1:
              raise SystemExit('sphere CSS edge opacity fallback not found exactly once')
          text = text.replace('--edge-opacity: 0.55;', '--edge-opacity: 0.28;')
          # Preserve behavior: only visual defaults change.
          if text.count('"edgeVisibility": "sempre"') != 1 or text.count('edgeVisibility: "sempre"') != 1:
              raise SystemExit('sphere edgeVisibility behavior changed unexpectedly')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate sphere source and repository
        run: |
          python -m pip install -q pyyaml pytest
          python -m py_compile scripts/build_sphere.py
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/build_sphere.py').read_text(encoding='utf-8')
          assert '#9aa0a8' not in text
          assert text.count('#858b93') >= 5
          assert '"edgeOpacity": 0.28' in text
          assert 'edgeOpacity: 0.28' in text
          assert '--edge-opacity: 0.28;' in text
          assert '"edgeVisibility": "sempre"' in text
          assert 'edgeVisibility: "sempre"' in text
          print('sphere visual contract PASS')
          PY
          python scripts/check_repo.py --quick
      - name: Commit validated source and self-clean
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/align-sphere-edge-style-once.yml
          git add scripts/build_sphere.py
          git diff --cached --check
          git commit -m "Align sphere edge styling with graph"
          git push origin HEAD:main
